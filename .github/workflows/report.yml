name: hourly-league-report

on:
  schedule:
    # Runs in UTC. GitHub doesn't guarantee exact timing under load,
    # especially at the top of the hour when everyone else's cron fires too.
    - cron: "43 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Stops overlapping runs from racing each other if one run is still going
# when the next hour's trigger fires (shouldn't normally happen, but cheap
# insurance).
concurrency:
  group: hourly-league-report
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the new reports/ files back to the repo

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --break-system-packages requests curl_cffi

      - name: Run report.py
        run: python report.py

      - name: Commit and push if the report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No new report this run (week in progress, off-season, or postseason) -- nothing to commit."
          else
            git commit -m "Auto-update league report ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
